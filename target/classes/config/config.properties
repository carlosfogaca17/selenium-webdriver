# ============================================
# CONFIGURAÇÕES DE AMBIENTE
# ============================================

# Ambiente atual (development, homologation, production, ci)
environment=dev

# ============================================
# URLs POR AMBIENTE
# ============================================

dev.base.url=https://www.saucedemo.com
dev.api.url=https://jsonplaceholder.typicode.com

hml.base.url=https://www.saucedemo.com
hml.api.url=https://jsonplaceholder.typicode.com

prd.base.url=https://www.saucedemo.com
prd.api.url=https://jsonplaceholder.typicode.com

ci.base.url=https://www.saucedemo.com
ci.api.url=https://jsonplaceholder.typicode.com

# ============================================
# CREDENCIAIS POR AMBIENTE
# ============================================

dev.username=standard_user
dev.password=secret_sauce
dev.locked_user=locked_out_user

hml.username=standard_user
hml.password=secret_sauce

prd.username=standard_user
prd.password=secret_sauce

ci.username=standard_user
ci.password=secret_sauce
ci.locked_user=locked_out_user

# ============================================
# TIMEOUTS E CONFIGURAÇÕES
# ============================================

implicit.wait=10
explicit.wait=20
page.load.timeout=30

# ============================================
# REPORT CONFIGURATIONS
# ============================================

screenshot.on.failure=true
report.path=reports/