name: Regressive Automated Tests

# Controla quando o fluxo será executado
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    # Máquina virtual estável do Ubuntu fornecida pelo GitHub
    runs-on: ubuntu-latest

    # Permissões atualizadas para aceitar tanto comentários em PR quanto o deploy no GH Pages
    permissions:
      statuses: write
      checks: write
      pull-requests: write
      contents: write  # Mudado para write para permitir que as actions manipulem branches de histórico
      pages: write     # Adicionado para permitir o deploy do Allure no GitHub Pages

    steps:
    # 1. Faz o download do código do seu repositório para a máquina virtual
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Configura o ambiente Java 17 com cache do Maven para acelerar os próximos deploys
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    # 3. Instala o Google Chrome na máquina do Linux Ubuntu da nuvem
    - name: Install Google Chrome
      run: |
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable

    # 4. Executa os testes usando o perfil de CI que ativa o modo fantasma (Headless) automaticamente
    - name: Run Automated Tests
      run: |
          mvn clean test -Pci \
            -Dcucumber.filter.tags="@regression" \
            -Dci.username="${{ secrets.CI_USERNAME }}" \
            -Dci.password="${{ secrets.CI_PASSWORD }}" \
            -Dci.locked_user="${{ secrets.CI_LOCKED_USER }}"

    # 5. Visão Rápida: Cria a tabela de resultados e comenta no PR (Excelente para DEVs/QAs no dia a dia)
    - name: Test Reporter with PR Comment
      uses: n-ryu/test-reporter@v0.0.2
      if: always() # Garante que analisa os testes mesmo se algum deles falhar
      with:
        name: 'Cucumber Test Results'
        path: 'reports/cucumber.xml'
        reporter: 'java-junit'

    # 6. ALLURE - Histórico: Carrega dados das execuções anteriores para gerar os gráficos de tendência
    - name: Load Allure test report history
      uses: actions/checkout@v4
      if: always()
      continue-on-error: true
      with:
        ref: gh-pages
        path: gh-pages-dir

    # 7. ALLURE - Build: Corrigido com o repositório oficial correto do Allure
    - name: Build Allure Report
      uses: allure-framework/allure-github-actions@v1.0.4
      if: always()
      id: allure-report
      with:
        allure_results: allure-results
        allure_history: allure-history
        keep_reports: 20
        allure_version: 2.24.0 # Força o uso de uma versão estável e compatível do Allure

    # 8. ALLURE - Deploy: Publica o dashboard gerado diretamente no link do GitHub Pages
    - name: Deploy Allure Report to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      if: always()
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: allure-history

    # 9. Salva os relatórios e prints brutos para você baixar se necessário
    - name: Upload Test Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-execution-reports
        path: |
          reports/
          evidencias/
        retention-days: 7